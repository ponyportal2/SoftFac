name: SoftFac PR policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]

# This workflow is defined by the pull request it evaluates, so it must never
# hold a write token. Post-merge repair runs from trusted default-branch YAML
# in softfac-repair.yml instead.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: softfac-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the base commit, not the pull request's own code.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check issue and approval policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node dist/cli.js check-pr "${{ github.event.pull_request.number }}"
