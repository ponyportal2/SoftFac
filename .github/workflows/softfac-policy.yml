name: SoftFac PR policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: softfac-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    # A closed PR only matters when it merged: that is the moment an issue can
    # be closed by a non-compliant PR, which is what --repair exists for.
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job holds issues: write. Checking out the default merge ref
          # would build and run the pull request's own code with that token.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check issue and approval policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node dist/cli.js check-pr "${{ github.event.pull_request.number }}" --repair
